<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xaveco — teste</title>
<style>
  :root{--bg:#efe7dd;--me:#d9fdd3;--bot:#fff;--brand:#7a1fa2;--ink:#111b21;--muted:#667781}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
  body{display:flex;flex-direction:column;background:var(--bg);max-width:520px;margin:0 auto}
  header{background:var(--brand);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
  .av{width:38px;height:38px;border-radius:50%;background:#ff4f8b;display:grid;place-items:center;font-size:20px}
  header b{display:block;font-size:15px} header small{opacity:.8;font-size:12px}
  header .sp{flex:1}
  header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer}
  #chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
  .m{max-width:85%;padding:8px 11px;border-radius:10px;font-size:15px;line-height:1.38;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.08)}
  .bot{align-self:flex-start;background:var(--bot)} .me{align-self:flex-end;background:var(--me)}
  .m img{max-width:200px;border-radius:8px;display:block}
  .m audio{width:230px}
  .btns{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .btns button{border:0;border-top:1px solid #eee;background:none;color:#027eb5;font-size:15px;padding:8px;cursor:pointer}
  .copy{float:right;margin-left:8px;border:0;background:#f0f2f5;border-radius:6px;font-size:11px;padding:3px 6px;cursor:pointer;color:var(--muted)}
  .wait{align-self:flex-start;color:var(--muted);font-size:13px;font-style:italic}
  form{display:flex;gap:6px;padding:8px;background:#f0f2f5;align-items:center}
  form input[type=text]{flex:1;border:0;border-radius:20px;padding:11px 14px;font-size:15px;outline:none}
  .ib{width:42px;height:42px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;flex:none}
  .ib.alt{background:#fff;color:var(--brand)}
  .ib.rec{background:#e53935;color:#fff;animation:p 1s infinite}
  @keyframes p{50%{opacity:.6}}
  .tools{display:flex;gap:6px;padding:0 8px 8px;background:#f0f2f5;flex-wrap:wrap}
  .tools button{border:1px solid #ccd;background:#fff;border-radius:14px;padding:5px 10px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="av">😏</div>
  <div><b>Xaveco</b><small id="st">modo teste</small></div>
  <div class="sp"></div>
  <button onclick="reset()">↻ Zerar</button>
</header>
<div id="chat"></div>
<div class="tools">
  <button onclick="send('assinar')">assinar</button>
  <button onclick="send('status')">status</button>
  <button onclick="pagar()">💸 Simular Pix pago</button>
  <button onclick="send('voz off')">voz off</button>
</div>
<form id="f">
  <label class="ib alt" title="Mandar print">📎<input type="file" id="file" accept="image/*,audio/*" hidden></label>
  <input type="text" id="t" placeholder="Mensagem" autocomplete="off">
  <button class="ib alt" type="button" id="mic" title="Gravar áudio">🎙️</button>
  <button class="ib" type="submit">➤</button>
</form>
<script>
const K = new URLSearchParams(location.search).get("k");
let ID = localStorage.getItem("xvid") || String(Math.floor(Math.random()*1e9)); localStorage.setItem("xvid", ID);
const chat = document.getElementById("chat");
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt = s => esc(s).replace(/\*(.+?)\*/g,"<b>$1</b>").replace(/_(.+?)_/g,"<i>$1</i>");
function add(cls, html){ const d=document.createElement("div"); d.className="m "+cls; d.innerHTML=html; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }
function render(rs){
  for (const r of rs){
    if (r.type==="text"){ const d=add("bot", fmt(r.text.body)); const b=document.createElement("button"); b.className="copy"; b.textContent="copiar";
      b.onclick=()=>navigator.clipboard.writeText(r.text.body).then(()=>b.textContent="✓"); d.prepend(b); }
    else if (r.type==="interactive"){ const i=r.interactive; const d=add("bot", fmt(i.body.text)); const w=document.createElement("div"); w.className="btns";
      i.action.buttons.forEach(b=>{ const x=document.createElement("button"); x.textContent=b.reply.title; x.onclick=()=>post({type:"interactive",text:b.reply.id},"▸ "+b.reply.title); w.appendChild(x); }); d.appendChild(w); }
    else if (r.type==="audio"){ add("bot", `<audio controls src="${r.audio._sim}"></audio>`); }
  }
}
async function call(p, body){
  const w=document.createElement("div"); w.className="wait"; w.textContent="Xaveco digitando…"; chat.appendChild(w); chat.scrollTop=chat.scrollHeight;
  try{ const r=await fetch(p+"?k="+encodeURIComponent(K),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:ID,...body})});
    const j=await r.json(); w.remove(); render(j.respostas||[]); }
  catch(e){ w.textContent="erro: "+e.message; }
}
function post(body, mostrar){ if(mostrar) add("me", esc(mostrar)); return call("/teste/msg", body); }
function send(t){ t=(t||"").trim(); if(!t) return; document.getElementById("t").value=""; post({type:"text",text:t}, t); }
function pagar(){ add("me","<i>(simulando o Pix caindo…)</i>"); call("/teste/pagar",{}); }
async function reset(){ await fetch("/teste/reset?k="+encodeURIComponent(K),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:ID})}); chat.innerHTML=""; add("bot","<i>Zerado. Manda um oi como se fosse um usuário novo.</i>"); }
document.getElementById("f").onsubmit=e=>{e.preventDefault(); send(document.getElementById("t").value);};
document.getElementById("file").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ const audio=f.type.startsWith("audio"); add("me", audio?`<audio controls src="${r.result}"></audio>`:`<img src="${r.result}">`);
    post({type:audio?"audio":"image", data:r.result, text:document.getElementById("t").value}); document.getElementById("t").value=""; };
  r.readAsDataURL(f); e.target.value=""; };
// gravar áudio
let rec=null, parts=[];
document.getElementById("mic").onclick=async()=>{
  const b=document.getElementById("mic");
  if(rec){ rec.stop(); return; }
  try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); rec=new MediaRecorder(s); parts=[];
    rec.ondataavailable=e=>parts.push(e.data);
    rec.onstop=()=>{ s.getTracks().forEach(t=>t.stop()); b.classList.remove("rec"); b.textContent="🎙️";
      const blob=new Blob(parts,{type:rec.mimeType||"audio/webm"}); rec=null; const fr=new FileReader();
      fr.onload=()=>{ add("me",`<audio controls src="${fr.result}"></audio>`); post({type:"audio",data:fr.result}); }; fr.readAsDataURL(blob); };
    rec.start(); b.classList.add("rec"); b.textContent="■"; }
  catch(e){ alert("Não consegui acessar o microfone"); }
};
if(!chat.children.length) add("bot","<i>Tela de teste do Xaveco. Manda um <b>oi</b> pra começar como usuário novo.</i>");
</script>
</body>
</html>
